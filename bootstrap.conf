# Gnulib modules used by Dials.
gnulib_modules="
  announce-gen
  c-strtod
  closeout
  do-release-commit-and-tag
  error
  fdl
  gendocs
  getopt-gnu
  gettext-h
  gitlog-to-changelog
  gnu-web-doc-update
  gnupload
  maintainer-makefile
  manywarnings
  readme-release
  update-copyright
  warnings
  xalloc
"

COPYRIGHT_HOLDER='Richard L.'

# Additional xgettext options to use.  Use "\\\newline" to break lines.
XGETTEXT_OPTIONS=$XGETTEXT_OPTIONS'\\\
 --flag=error:3:c-format\\\
 --flag=error_at_line:5:c-format\\\
 --flag=c_fprintf:2:c-format\\\
 --from-code=UTF-8\\\
'

# Translations come from the Translation Project once Dials is
# registered there; until then there are none to download.
SKIP_PO=t

# Build prerequisites.
buildreq="\
autoconf   2.71
automake   1.16
autopoint  0.21
git        1.5.5
makeinfo   -
pkg-config -
tar        -
"

bootstrap_post_import_hook ()
{
  # Only needed with an included copy of the gettext library.
  if grep '^[	 ]*AM_GNU_GETTEXT(\[*external]*[,)]' \
          configure.ac >/dev/null 2>&1; then
    rm -f m4/longlong.m4
  fi
}
