version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the shared steps under .github/actions.
    directories:
      - /
      - /.github/actions/*
    # Changes go to develop, like all other work, and reach master
    # with the next release.
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: Update
